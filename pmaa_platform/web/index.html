<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PMAA 甲基化分析平台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b6bcb'/%3E%3Ctext x='16' y='23' font-size='17' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'%3EP%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="logo">PMAA</span>
      <div>
        <h1>多糖甲基化分析平台</h1>
        <p class="sub">PMAA · EI 质谱参考库 · 证据驱动的糖残基连接候选</p>
      </div>
    </div>
    <div class="topbar-right">
      <span class="pill" id="healthPill">连接中…</span>
    </div>
  </header>

  <nav class="steps" id="steps">
    <div class="steps-main" id="stepsMain"></div>
    <span class="divider"></span>
    <button class="step ghost" data-view="library">参考库</button>
    <button class="step ghost" data-view="providers">LLM 配置</button>
    <button class="step ghost" data-view="ristd">RI 标准库</button>
  </nav>

  <main id="main"></main>
  <div class="wizbar" id="wizbar"></div>

  <footer class="foot">
    规则版本 <code id="ruleVersion">—</code> · 参考库条目 <code id="refCount">—</code> ·
    化学实体 <code id="derivCount">—</code>
    <span class="foot-note">本平台输出为<b>候选与证据</b>；α/β、D/L 构型与准确 mol% 不由常规甲基化分析产生。</span>
  </footer>
</div>
<script src="app.js?v=20260913-multispectrum-2"></script>
</body>
</html>
